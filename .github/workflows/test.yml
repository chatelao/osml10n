name: Test osml10n

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        chmod +x test/install.sh
        ./test/install.sh

    - name: Run tests
      run: |
        chmod +x test/run_test.sh
        ./test/run_test.sh
